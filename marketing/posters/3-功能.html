<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>三溪缩影 功能</title>
<link rel="stylesheet" href="poster.css">
<style>
  body { width: 1080px; height: 1440px; position: relative; background: var(--bg); }
  .head { position: absolute; left: 80px; right: 80px; top: 72px; }
  .head .row { display: flex; align-items: center; gap: 16px; }
  .head .row img { width: 56px; height: 56px; }
  .head .row span { font-size: 30px; }
  .head h1 { margin-top: 36px; font-size: 64px; letter-spacing: .01em; }
  .head h1 b { color: var(--persimmon); font-weight: 400; }
  .head p { margin-top: 16px; font-size: 24px; color: var(--ink-2); }
  .grid { position: absolute; left: 80px; right: 80px; top: 360px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 26px;
          box-shadow: 0 1px 2px rgba(29,51,49,.06), 0 8px 24px rgba(29,51,49,.08); height: 470px; overflow: hidden; }
  .card .n { font-family: var(--f-en); font-weight: 700; font-size: 20px; color: var(--persimmon); }
  .card h2 { margin-top: 6px; font-size: 34px; }
  .card p { margin-top: 10px; font-size: 19px; color: var(--ink-2); line-height: 1.55; height: 60px; }
  .card .pic { margin-top: 18px; height: 280px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); position: relative; background: #F6FAF6; }
  .card .pic img { position: absolute; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 48px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; color: var(--ink-3); }
  .foot img { height: 36px; }
</style>
</head>
<body>
  <div class="head">
    <div class="row"><img src="../assets/icon-512.png" alt=""><span class="display">三溪缩影</span></div>
    <h1 class="display">像 <span class="lat">ZIP</span> 一样用，<b>比 <span class="lat">ZIP</span> 懂图像</b>。</h1>
    <p>四步看懂：压缩、浏览、预览、解压。</p>
  </div>
  <div class="grid">
    <div class="card">
      <div class="n">01</div><h2 class="display">右键压缩</h2>
      <p>文件夹打成一个 .iisz 包，单张图压成 .iis。默认保留原文件。</p>
      <div class="pic"><img src="../assets/shots/压缩窗口.png" style="width:118%; left:-3%; top:-26px"></div>
    </div>
    <div class="card">
      <div class="n">02</div><h2 class="display">包里直接看</h2>
      <p>双击 .iisz，像文件夹一样浏览，点图就看，不用先解压。</p>
      <div class="pic"><img src="../assets/shots/包内浏览.png" style="width:1416px; left:-23px; top:-290px"></div>
    </div>
    <div class="card">
      <div class="n">03</div><h2 class="display">缩略图一眼认出</h2>
      <p>资源管理器里 .iis 显示图本身，.iisz 显示前 4 张的拼图。</p>
      <div class="pic"><img src="../assets/shots/看图-浅色.png" style="width:1416px; left:-23px; top:-409px"></div>
    </div>
    <div class="card">
      <div class="n">04</div><h2 class="display">解压一字节不差</h2>
      <p>每个文件核对 SHA-256，与原文件逐字节相同；已有文件绝不覆盖。</p>
      <div class="pic"><img src="../assets/shots/解压完成.png" style="width:118%; left:-3%; top:-26px"></div>
    </div>
  </div>
  <div class="foot"><span>Windows 10 / 11 · 普通用户双击即装</span><img src="../assets/threebrook-lockup-light.svg" alt="三溪"></div>
</body>
</html>
